name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talentflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve patched TanStack Start dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Verify patched TanStack Start versions
        run: |
          node -e "const l=require('./package-lock.json'); const r=l.packages['node_modules/@tanstack/react-start']?.version; const c=l.packages['node_modules/@tanstack/start-server-core']?.version; const ge=(v,m)=>!!v&&v.split('.').map(Number).join('.')!==''&&v.split('.').map(Number).reduce((a,n,i)=>a||(n-Number(m.split('.')[i])),0)>=0; console.log({reactStart:r,startServerCore:c}); if (!ge(r,'1.168.60') || !ge(c,'1.169.39')) process.exit(1)"

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validate Firebase Functions
        run: |
          cd functions
          npm install --no-package-lock --no-audit --no-fund
          npm run lint
          npm test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install isolated Firebase rules test environment
        run: |
          mkdir -p /tmp/firestore-rules-test/tests
          cp firebase.json firestore.rules storage.rules /tmp/firestore-rules-test/
          cp tests/firestore.rules.test.mjs tests/storage.rules.test.mjs /tmp/firestore-rules-test/tests/
          cd /tmp/firestore-rules-test
          npm init -y
          npm install --no-save --package-lock=false --no-audit --no-fund "firebase@^12.17.1" firebase-tools @firebase/rules-unit-testing

      - name: Run Firestore Security Rules tests
        run: cd /tmp/firestore-rules-test && npx firebase emulators:exec --only firestore,storage --project demo-talentflow-rules "node --test tests/firestore.rules.test.mjs tests/storage.rules.test.mjs"
